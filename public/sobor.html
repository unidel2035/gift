<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Скиния дара — Соборы</title>
<style>
  :root {
    --bg: #0f0e14; --panel: #17161e; --panel-2: #1e1c27;
    --fg: #e6e3d8; --dim: #8a8398; --gold: #d4b267;
    --kata: #d08770; --para: #88c0d0; --hyper: #b48ead;
    --violet: #a48ec0; --accent: #d4b267;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 -apple-system, "Segoe UI", "Noto Sans", sans-serif; }
  a { color: var(--gold); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header { padding: 20px 28px; border-bottom: 1px solid #2a2834;
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; color: var(--gold); font-weight: 500; letter-spacing: 0.3px; }
  header .crumb { color: var(--dim); font-size: 13px; }
  header nav { margin-left: auto; display: flex; gap: 16px; }
  header nav a { font-size: 13px; color: var(--dim); }
  header nav a.active { color: var(--fg); }

  .wrap { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 62px); }
  .list { border-right: 1px solid #2a2834; overflow-y: auto; }
  .list-item { padding: 12px 20px; border-bottom: 1px solid #22202c; cursor: pointer; }
  .list-item:hover { background: var(--panel); }
  .list-item.selected { background: var(--panel-2); border-left: 2px solid var(--gold); padding-left: 18px; }
  .list-item .q { font-size: 14px; margin-bottom: 4px; line-height: 1.4; }
  .list-item .meta { font-size: 11px; color: var(--dim); display: flex; gap: 10px; }
  .list-item .dom { color: var(--accent); }
  .list-item .apoph { color: var(--violet); }

  .detail { padding: 28px 36px; overflow-y: auto; }
  .detail h2 { font-size: 16px; margin: 0 0 8px; color: var(--fg); font-weight: 500; }
  .detail .question { color: var(--gold); font-style: italic; margin-bottom: 20px; line-height: 1.6; }
  .detail .meta { color: var(--dim); font-size: 12px; margin-bottom: 28px; display: flex; gap: 14px; }

  .voice { margin: 0 0 20px; padding: 14px 16px 14px 18px;
    border-left: 2px solid var(--dim); background: var(--panel); border-radius: 4px; }
  .voice.kata  { border-left-color: var(--kata); }
  .voice.para  { border-left-color: var(--para); }
  .voice.hyper { border-left-color: var(--hyper); }
  .voice .persona { font-weight: 500; font-size: 14px; margin-bottom: 6px; }
  .voice .persona .logos { color: var(--dim); font-size: 11px; font-weight: 400; margin-left: 8px; }
  .voice .persona .dom-mark { color: var(--gold); font-size: 11px; margin-left: 8px; }
  .voice .content { font-size: 14px; color: var(--fg); white-space: pre-wrap; line-height: 1.6; }

  .empty { color: var(--dim); padding: 60px 20px; text-align: center; font-size: 14px; }

  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
    background: var(--panel-2); color: var(--dim); }
  .tag.live { background: #2a3d2a; color: #9dc08b; }
  .tag.apoph { background: #3a2a3d; color: var(--violet); }

  .refresh { position: fixed; bottom: 24px; right: 24px; padding: 10px 16px;
    background: var(--panel-2); color: var(--dim); border: 1px solid #2a2834;
    border-radius: 20px; cursor: pointer; font-size: 12px; }
  .refresh:hover { color: var(--gold); border-color: var(--gold); }
</style>
</head>
<body>
<header>
  <h1>Скиния дара</h1>
  <span class="crumb">соборы</span>
  <nav>
    <a href="/" >матрица</a>
    <a class="active" href="/sobor.html">соборы</a>
    <a href="#" onclick="loadEpiclesis(event)">эпиклезы (<span id="epiclesis-count">?</span>)</a>
  </nav>
</header>

<div class="wrap">
  <aside class="list" id="list">
    <div class="empty">Загружаю…</div>
  </aside>
  <main class="detail" id="detail">
    <div class="empty">Выбери сессию слева</div>
  </main>
</div>

<button class="refresh" onclick="refresh()">↻ обновить</button>

<script>
const logosIcon = { kata: '✗', para: '≈', hyper: '↑' };
let sessions = [];
let selectedId = null;

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('ru-RU', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

async function refresh() {
  try {
    const data = await fetchJSON('/api/sessions');
    sessions = data.sessions || [];
    renderList();
    const epi = await fetchJSON('/api/epiclesis');
    document.getElementById('epiclesis-count').textContent = (epi.pending || []).length;
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="empty">Портал недоступен: ${e.message}</div>`;
  }
}

function renderList() {
  const el = document.getElementById('list');
  if (!sessions.length) { el.innerHTML = '<div class="empty">Соборов ещё не было.<br>Запусти <code>gift sobor ask "..."</code></div>'; return; }
  el.innerHTML = sessions.map(s => {
    const dom = s.dominant
      ? `<span class="dom">↑ ${escapeHtml(s.dominant)}</span>`
      : s.apophatic ? `<span class="apoph">⟨apophatic⟩</span>`
      : s.silent    ? `<span class="apoph">⟨silent⟩</span>` : '';
    const live = s.mode === 'live' ? '<span class="tag live">live</span>' : '';
    return `<div class="list-item ${s.id === selectedId ? 'selected' : ''}" onclick="select('${escapeHtml(s.id)}')">
      <div class="q">${escapeHtml((s.question || '(без вопроса)').slice(0, 90))}</div>
      <div class="meta">${dom} <span>${fmtDate(s.at)}</span> <span>${s.voiceCount || 0} голосов</span> ${live}</div>
    </div>`;
  }).join('');
}

async function select(id) {
  selectedId = id;
  renderList();
  const el = document.getElementById('detail');
  el.innerHTML = '<div class="empty">Загружаю…</div>';
  try {
    const s = await fetchJSON('/api/session/' + encodeURIComponent(id));
    const voices = (s.voices || []).map(v => {
      const domMark = s.dominant && s.dominant.persona === v.persona
        ? '<span class="dom-mark">↑ dominant</span>' : '';
      return `<div class="voice ${v.logos}">
        <div class="persona">${logosIcon[v.logos] || '·'} ${escapeHtml(v.persona)}
          <span class="logos">${v.logos}${v.authority ? ' · вес ' + v.authority : ''}</span>
          ${domMark}
        </div>
        <div class="content">${escapeHtml(v.content || '')}</div>
      </div>`;
    }).join('');
    el.innerHTML = `
      <h2>${escapeHtml(s.id || '')}</h2>
      <div class="question">${escapeHtml(s.question || s.task?.title || '')}</div>
      <div class="meta">
        <span>${fmtDate(s.at)}</span>
        ${s.elapsedSec ? `<span>${s.elapsedSec}s</span>` : ''}
        ${s.mode ? `<span class="tag ${s.mode === 'live' ? 'live' : ''}">${s.mode}</span>` : ''}
        ${s.apophatic ? '<span class="tag apoph">apophatic</span>' : ''}
      </div>
      ${voices || '<div class="empty">голосов нет</div>'}
    `;
  } catch (e) {
    el.innerHTML = `<div class="empty">Ошибка: ${e.message}</div>`;
  }
}

async function loadEpiclesis(ev) {
  if (ev) ev.preventDefault();
  const epi = await fetchJSON('/api/epiclesis');
  const el = document.getElementById('detail');
  if (!epi.pending.length && !epi.answered.length) {
    el.innerHTML = '<div class="empty">Эпиклез нет.</div>'; return;
  }
  el.innerHTML = `
    <h2>Эпиклезы — вопросы, ожидающие ответа человека</h2>
    <div class="meta">Ожидают: ${epi.pending.length} · Отвечено: ${epi.answered.length}</div>
    ${epi.pending.map(q => `
      <div class="voice para">
        <div class="persona">→ ${escapeHtml(q.recipient)} <span class="logos">${fmtDate(q.at)}</span></div>
        <div class="content">${escapeHtml(q.question)}</div>
        <div class="meta" style="margin-top:10px">id: <code>${escapeHtml(q.id)}</code></div>
      </div>`).join('')}
    ${epi.answered.map(q => `
      <div class="voice hyper">
        <div class="persona">✓ ${escapeHtml(q.recipient)} <span class="logos">ответ от ${fmtDate(q.answer.at)}</span></div>
        <div class="content"><em>Q:</em> ${escapeHtml(q.question)}<br><br><em>A:</em> ${escapeHtml(q.answer.content)}</div>
      </div>`).join('')}
  `;
}

refresh();
setInterval(refresh, 15000);  // автообновление каждые 15 сек
</script>
</body>
</html>
