<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Κοινόν — собор</title>
<style>
  :root {
    --bg: #0f0e14; --panel: #17161e; --panel-2: #1e1c27;
    --fg: #e6e3d8; --dim: #8a8398; --gold: #d4b267;
    --kata: #d08770; --para: #88c0d0; --hyper: #b48ead; --violet: #a48ec0;
    --user: #d4b267;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.55 -apple-system, "Segoe UI", "Noto Sans", sans-serif; overflow: hidden; }
  a { color: var(--gold); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .app { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 24px; border-bottom: 1px solid #2a2834;
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; color: var(--gold); font-weight: 500; letter-spacing: 0.4px; }
  header .crumb { color: var(--dim); font-size: 12px; }
  header nav { margin-left: auto; display: flex; gap: 14px; font-size: 12px; }
  header nav a { color: var(--dim); }
  header nav a.active { color: var(--fg); }

  .messages { flex: 1; overflow-y: auto; padding: 24px 20px 20px; max-width: 860px; margin: 0 auto; width: 100%; }
  .msg { margin-bottom: 20px; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .msg.user .bubble {
    background: transparent; border: 1px solid var(--user);
    color: var(--user); max-width: 80%; margin-left: auto;
    padding: 10px 14px; border-radius: 14px 14px 4px 14px;
  }
  .msg.sobor-head { color: var(--dim); font-size: 12px; margin-bottom: 4px; padding-left: 4px; }
  .msg.sobor-head .tick { color: var(--gold); }

  .voice-pending {
    color: var(--dim); font-size: 13px; padding: 10px 14px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .voice-pending .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--dim);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.3}50%{opacity:1} }

  .voice {
    background: var(--panel); padding: 12px 16px 12px 18px;
    border-left: 2px solid var(--dim); border-radius: 4px; margin-bottom: 10px;
  }
  .voice.kata  { border-left-color: var(--kata); }
  .voice.para  { border-left-color: var(--para); }
  .voice.hyper { border-left-color: var(--hyper); }
  .voice .head { font-size: 13px; margin-bottom: 6px; display: flex; gap: 10px; align-items: baseline; }
  .voice .persona { font-weight: 500; color: var(--fg); }
  .voice .logos { color: var(--dim); font-size: 11px; }
  .voice .elapsed { color: var(--dim); font-size: 11px; margin-left: auto; }
  .voice .dom-mark { color: var(--gold); font-size: 11px; }
  .voice .body { font-size: 14px; line-height: 1.6; white-space: pre-wrap; color: var(--fg); }

  .sobor-result {
    margin-top: 8px; padding: 8px 14px; font-size: 12px; color: var(--dim);
    background: var(--panel-2); border-radius: 6px;
  }
  .sobor-result.dominant { color: var(--gold); }
  .sobor-result.apophatic { color: var(--violet); }

  .compose {
    border-top: 1px solid #2a2834; padding: 14px 20px; background: var(--panel);
    display: flex; gap: 10px; max-width: 860px; margin: 0 auto; width: 100%;
  }
  .compose textarea {
    flex: 1; padding: 10px 14px; background: var(--panel-2); color: var(--fg);
    border: 1px solid #2a2834; border-radius: 8px; resize: none; font: inherit;
    min-height: 40px; max-height: 150px;
  }
  .compose textarea:focus { outline: none; border-color: var(--gold); }
  .compose button {
    padding: 0 18px; background: var(--gold); color: #17161e; border: none;
    border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 14px;
    white-space: nowrap;
  }
  .compose button:disabled { background: var(--dim); cursor: not-allowed; }

  .mode-toggle { margin-left: auto; font-size: 12px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  .mode-toggle input { accent-color: var(--gold); }

  .hint { color: var(--dim); text-align: center; padding: 40px 20px; font-size: 14px; }
  .hint code { background: var(--panel-2); padding: 2px 8px; border-radius: 4px; color: var(--fg); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Κοινόν — собор</h1>
    <span class="crumb">живой диалог с федерацией лиц</span>
    <nav>
      <a class="active" href="/chat.html">чат</a>
      <a href="/sobor.html">журнал</a>
      <a href="/">матрица</a>
    </nav>
  </header>

  <div class="messages" id="messages">
    <div class="hint">
      Напиши вопрос — соберётся собор из трёх лиц:<br>
      <code>Разведчик</code> (para) · <code>Критик</code> (kata) · <code>Старший</code> (hyper)<br><br>
      Живой режим — 30–60 сек, голоса приходят по одному.
    </div>
  </div>

  <form class="compose" onsubmit="ask(event)" id="form">
    <textarea id="q" placeholder="вопрос собору..." rows="1" required></textarea>
    <div class="mode-toggle">
      <label><input type="checkbox" id="static" /> static</label>
    </div>
    <button type="submit" id="sendBtn">спросить</button>
  </form>
</div>

<script>
const logosIcon = { kata: '✗', para: '≈', hyper: '↑' };
let activeES = null;

const $ = id => document.getElementById(id);
const msgs = $('messages');

function addEl(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  msgs.appendChild(d.firstChild);
  msgs.scrollTop = msgs.scrollHeight;
  return msgs.lastChild;
}

function esc(s) {
  return (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function clearHint() {
  const h = msgs.querySelector('.hint');
  if (h) h.remove();
}

async function ask(ev) {
  ev.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;
  const mode = $('static').checked ? 'static' : 'live';

  clearHint();

  // user bubble
  addEl(`<div class="msg user"><div class="bubble">${esc(q)}</div></div>`);

  $('q').value = '';
  $('sendBtn').disabled = true;
  $('sendBtn').textContent = '…';

  // sobor header
  const headId = 'head-' + Date.now();
  addEl(`<div class="msg sobor-head" id="${headId}">⟳ Собор собирается…</div>`);

  // pending-slots — заполнятся по приходу
  const pendingBox = addEl(`<div id="pending-${headId}"></div>`);

  const url = '/api/chat/stream?q=' + encodeURIComponent(q) + '&mode=' + mode;
  const es = new EventSource(url);
  activeES = es;
  const waitingSlots = {};   // persona → элемент ожидания

  es.addEventListener('start', (e) => {
    const d = JSON.parse(e.data);
    $(headId).innerHTML = `⟳ Собор собирается <span class="tick">· ${d.sources.map(s => s.persona).join(' · ')}</span>`;
    for (const s of d.sources) {
      const slot = document.createElement('div');
      slot.className = 'voice-pending';
      slot.innerHTML = `<span class="dot"></span> ${esc(s.persona)} <span class="logos" style="color:var(--dim);font-size:11px">(${s.logos}) думает...</span>`;
      pendingBox.appendChild(slot);
      waitingSlots[s.persona] = slot;
    }
    msgs.scrollTop = msgs.scrollHeight;
  });

  es.addEventListener('voice', (e) => {
    const v = JSON.parse(e.data);
    const icon = logosIcon[v.logos] || '·';
    const html = `<div class="voice ${v.logos}">
      <div class="head">
        <span class="persona">${icon} ${esc(v.persona)}</span>
        <span class="logos">${v.logos}</span>
        <span class="elapsed">${v.elapsedSec}s</span>
      </div>
      <div class="body">${esc(v.content)}</div>
    </div>`;
    const wrap = document.createElement('div');
    wrap.innerHTML = html;
    const slot = waitingSlots[v.persona];
    if (slot) slot.replaceWith(wrap.firstChild);
    else pendingBox.appendChild(wrap.firstChild);
    delete waitingSlots[v.persona];
    msgs.scrollTop = msgs.scrollHeight;
  });

  es.addEventListener('done', (e) => {
    const d = JSON.parse(e.data);
    // remove any remaining pending slots
    for (const slot of Object.values(waitingSlots)) slot.remove();
    $(headId).innerHTML = `✓ Собор завершён <span class="tick">· ${d.elapsedSec}s</span>`;

    let resultCls = '', resultText = '';
    if (d.dominant) {
      resultCls = 'dominant';
      resultText = `⟨dominant⟩ ${d.dominant.persona} (${d.dominant.logos}) — но остальные голоса сохранены`;
      // mark dominant voice
      const voices = pendingBox.querySelectorAll('.voice');
      voices.forEach(v => {
        if (v.querySelector('.persona').textContent.includes(d.dominant.persona)) {
          v.querySelector('.head').insertAdjacentHTML('beforeend',
            `<span class="dom-mark">↑ dominant</span>`);
        }
      });
    } else if (d.apophatic) {
      resultCls = 'apophatic';
      resultText = '⟨apophatic⟩ собор не сошёлся в dominant — истина не высказывается';
    } else if (d.silent) {
      resultCls = 'apophatic';
      resultText = '⟨silent⟩ ' + (d.silenceReason || '');
    }
    if (resultText) {
      pendingBox.insertAdjacentHTML('beforeend',
        `<div class="sobor-result ${resultCls}">${esc(resultText)}</div>`);
    }

    es.close();
    activeES = null;
    $('sendBtn').disabled = false;
    $('sendBtn').textContent = 'спросить';
    msgs.scrollTop = msgs.scrollHeight;
  });

  es.addEventListener('error', (e) => {
    let msg = 'ошибка потока';
    try { msg = JSON.parse(e.data).message || msg; } catch {}
    $(headId).innerHTML = `✗ ${esc(msg)}`;
    es.close();
    activeES = null;
    $('sendBtn').disabled = false;
    $('sendBtn').textContent = 'спросить';
  });
}

// auto-grow textarea
$('q').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(150, e.target.scrollHeight) + 'px';
});
// submit on Ctrl+Enter or Cmd+Enter
$('q').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') $('form').requestSubmit();
});
</script>
</body>
</html>
