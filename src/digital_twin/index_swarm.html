<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РОЙ СЕРАФИМ — Полигон</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a0a14;font-family:monospace}
.hud{position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.8);color:#0f0;font:10px monospace;padding:8px;border-radius:4px;z-index:100;min-width:200px}
.alert{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font:bold 18px monospace;z-index:999;text-align:center;pointer-events:none}
.legend{position:fixed;bottom:10px;right:10px;background:rgba(0,0,0,0.7);color:#ccc;font:10px monospace;padding:8px;border-radius:4px;z-index:100}
@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(0.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
</style>
</head>
<body>
<div class="hud" id="hud">Загрузка...</div>
<div class="legend">
🟦 Scout — разведка<br>🟨 Interceptor — патруль<br>🟥 FPV — атака<br>
⬜ цель не обнаружена<br>🟡 цель найдена<br>🟢 безопасно<br>🔴 АТАКОВАТЬ
</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const API='http://localhost:8100';
const S=2000;

// ── Scene ──────────────────────────────────────────────────
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x334466);
scene.fog=new THREE.Fog(0x556688,300,3000);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,10,5000);
camera.position.set(0,1000,1200);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

// ── Light ──────────────────────────────────────────────────
const sun=new THREE.DirectionalLight(0xffffcc,2.5);
sun.position.set(500,800,300);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-1200; sun.shadow.camera.right=1200;
sun.shadow.camera.top=1200; sun.shadow.camera.bottom=-1200;
sun.shadow.camera.near=10; sun.shadow.camera.far=4000;
scene.add(sun);
scene.add(new THREE.AmbientLight(0x445566,1.2));

// ── Ground ─────────────────────────────────────────────────
const terrainGeo=new THREE.PlaneGeometry(S,S,80,80);
const pos=terrainGeo.attributes.position.array;
for(let i=0;i<pos.length;i+=3){pos[i+2]=Math.sin(pos[i]*0.004)*Math.cos(pos[i+1]*0.005)*25+Math.sin(pos[i]*0.01+pos[i+1]*0.01)*10}
terrainGeo.computeVertexNormals();
const terrainMat=new THREE.MeshPhongMaterial({color:0x4a6a2a,flatShading:true,shininess:3});
const terrain=new THREE.Mesh(terrainGeo,terrainMat);
terrain.rotation.x=-Math.PI/2; terrain.receiveShadow=true; scene.add(terrain);

// Grid + roads
scene.add(new THREE.GridHelper(S,30,0x556633,0x334422));
const roadMat=new THREE.MeshPhongMaterial({color:0x666655});
[[-350,0],[350,0],[0,-350],[0,350]].forEach(([x,z])=>{
    const r=new THREE.Mesh(new THREE.PlaneGeometry(35,S),roadMat);
    r.rotation.x=-Math.PI/2; r.position.set(x,0.3,z); r.receiveShadow=true; scene.add(r);
});

// Trees
for(let i=0;i<400;i++){
    const tx=(Math.random()-0.5)*S*0.9, tz=(Math.random()-0.5)*S*0.9;
    if(Math.abs(tx)<40&&Math.abs(tz)<40) continue;
    const h=4+Math.random()*20;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(1.2,2,h,6),new THREE.MeshPhongMaterial({color:0x6b3a1e}));
    trunk.position.set(tx,h/2,tz); trunk.castShadow=true; scene.add(trunk);
    const leaves=new THREE.Mesh(new THREE.ConeGeometry(3+h*0.15,6+h*0.3,6),new THREE.MeshPhongMaterial({color:0x2a5a1a+Math.floor(Math.random()*4)*0x050500}));
    leaves.position.set(tx,h+3,tz); leaves.castShadow=true; scene.add(leaves);
}

// ── Drone factory ──────────────────────────────────────────
const droneMeshes=[];
function makeDrone(color){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.BoxGeometry(2.5,0.5,1.8),new THREE.MeshPhongMaterial({color,specular:0x888888,shininess:30})));
    for(let a=0;a<4;a++){
        const ang=a*Math.PI/2+Math.PI/4;
        const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,4.5,6),new THREE.MeshPhongMaterial({color:0x444444}));
        arm.rotation.z=Math.PI/2; arm.rotation.y=ang;
        arm.position.set(Math.cos(ang)*1.8,0,Math.sin(ang)*1.8); g.add(arm);
        const motor=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.4,12),new THREE.MeshPhongMaterial({color:0x777777}));
        motor.position.copy(arm.position).add(new THREE.Vector3(Math.cos(ang)*2.3,0,Math.sin(ang)*2.3)); g.add(motor);
        const prop=new THREE.Group();
        prop.add(new THREE.Mesh(new THREE.BoxGeometry(2.5,0.04,0.5),new THREE.MeshPhongMaterial({color:0xcccccc,transparent:true,opacity:0.4})));
        prop.position.copy(motor.position); prop.userData={speed:0}; g.add(prop);
    }
    const labelDiv=document.createElement('div');
    labelDiv.style.cssText='position:absolute;color:#fff;font:bold 10px monospace;pointer-events:none;text-shadow:0 0 5px #000';
    document.body.appendChild(labelDiv);
    g.userData={label:labelDiv};
    scene.add(g);
    return g;
}

const droneConfig=[
    {color:0x3388cc,role:'scout'},
    {color:0xccaa33,role:'interceptor'},
    {color:0xcc3333,role:'fpv'},
];
droneConfig.forEach(c=>droneMeshes.push(makeDrone(c.color)));

// ── Targets ─────────────────────────────────────────────────
const targetColors={strongpoint:0xff4444,bunker:0x996644,ew_station:0xff8800,vehicle:0x4488ff,person:0x44ff44,decoy:0x888888};
const targetMeshes=[];
function makeTarget(type,x,z){
    const g=new THREE.Group();
    const col=targetColors[type]||0xffffff;
    const s=type==='strongpoint'?16:type==='bunker'?9:type==='ew_station'?14:type==='vehicle'?7:type==='person'?2.5:11;
    const box=new THREE.Mesh(new THREE.BoxGeometry(s,type==='bunker'?4.5:3,s),new THREE.MeshPhongMaterial({color:col,emissive:new THREE.Color(col).multiplyScalar(0.08)}));
    box.position.y=1.5; box.castShadow=true; g.add(box);
    // Base marker
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(s*0.6,s*0.6,0.2,6),new THREE.MeshPhongMaterial({color:col})));
    g.position.set(x,0,z);
    g.userData={type,detected:false,classified:'',attack:false,killed:false};
    scene.add(g);
    return g;
}

['strongpoint','bunker','ew_station','vehicle','person','decoy'].forEach((t,i)=>{
    const tx=[300,-200,500,-400,100,-500][i];
    const tz=[200,350,-300,-200,500,-100][i];
    targetMeshes.push(makeTarget(t,tx,tz));
});

// ── FPV trail ───────────────────────────────────────────────
const trailPoints=[new THREE.Vector3(),new THREE.Vector3()];
const trailGeo=new THREE.BufferGeometry().setFromPoints(trailPoints);
const trailLine=new THREE.Line(trailGeo,new THREE.LineBasicMaterial({color:0xff6600,linewidth:1}));
scene.add(trailLine);

// ── Alert system ────────────────────────────────────────────
const alertDiv=document.createElement('div');
alertDiv.className='alert'; document.body.appendChild(alertDiv);
let lastEventCount=0;

// ── Main loop ───────────────────────────────────────────────
async function loop(){
    requestAnimationFrame(loop);
    try{
        const r=await fetch(API+'/api/swarm');
        const data=await r.json();

        // Update drones
        data.drones.forEach((d,i)=>{
            const dm=droneMeshes[i];
            if(!dm||d.killed){if(dm)dm.visible=false;return;}
            dm.visible=true;
            dm.position.lerp(new THREE.Vector3(d.x,d.y||100,d.z),0.1);
            dm.rotation.y=THREE.MathUtils.lerp(dm.rotation.y,-(d.heading-90)*Math.PI/180,0.1);
            // Spin props
            dm.children.forEach(c=>{if(c.userData&&c.userData.speed!==undefined)c.rotateY(d.role==='fpv'&&d.phase==='attack'?1.5:0.6);});
            // Label position (screen-space)
            const v=new THREE.Vector3(d.x,d.y+15,d.z).project(camera);
            const label=dm.userData.label;
            if(label){
                label.style.left=((v.x+1)/2*innerWidth)+'px';
                label.style.top=((-v.y+1)/2*innerHeight)+'px';
                const phaseNames={patrol:'🔵',classify:'🟡',attack:'🔴',rtb:'⚫',hold:'⏸',dead:'💀'};
                label.textContent=`${d.id.split('-')[0]} ${phaseNames[d.phase]||'?'} ${d.battery?.toFixed(0)}%`;
                label.style.color=d.phase==='attack'?'#ff4444':d.phase==='classify'?'#ffaa00':'#ffffff';
            }
        });

        // Update targets
        data.targets.forEach((t,i)=>{
            const tm=targetMeshes[i];
            if(!tm) return;
            if(t.killed){tm.visible=false;return;}
            // Color change on detection/classification
            const box=tm.children[0];
            if(t.attack && tm.userData.classified!==t.classified){
                box.material.emissive=new THREE.Color(0xff0000);
                box.material.emissiveIntensity=1.5;
                // Alert popup
                const el=document.createElement('div');
                el.className='alert';
                el.innerHTML=t.type==='decoy'||t.type==='person'?`🟢 ${t.type}: НЕ АТАКОВАТЬ`:`🔴 ${t.type}: АТАКОВАТЬ!`;
                el.style.color=t.type==='decoy'||t.type==='person'?'#00ff00':'#ff0000';
                el.style.animation='pop 2s ease-out forwards';
                document.body.appendChild(el);
                setTimeout(()=>el.remove(),2500);
            } else if(t.detected && !t.classified){
                box.material.emissive=new THREE.Color(0x666600);
                box.material.emissiveIntensity=0.8;
            }
            tm.userData.classified=t.classified;
        });

        // FPV trail
        const fpvDrone=data.drones[2];
        if(fpvDrone.phase==='attack'){
            trailPoints.unshift(new THREE.Vector3(fpvDrone.x,fpvDrone.y,fpvDrone.z));
            if(trailPoints.length>50) trailPoints.length=50;
            trailGeo.setFromPoints(trailPoints);
        }

        // HUD
        const hudText=data.drones.map(d=>
            `${d.id}: (${d.x?.toFixed(0)},${d.z?.toFixed(0)}) ${d.phase} 🔋${d.battery?.toFixed(0)}%`
        ).join('<br>');
        document.getElementById('hud').innerHTML=hudText+'<br>Целей уничтожено: '+data.targets.filter(t=>t.killed).length+'/'+data.targets.length;

        // Events
        if(data.events&&data.events.length>lastEventCount){
            lastEventCount=data.events.length;
        }

        // Camera
        const scout=data.drones[0];
        camera.position.lerp(new THREE.Vector3(scout.x+300,300,scout.z+300),0.02);
        camera.lookAt(scout.x,0,scout.z);
    }catch(e){}
    renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
loop();
</script>
</body>
</html>
