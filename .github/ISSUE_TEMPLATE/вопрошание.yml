name: Вопрошание
description: Задать вопрос общине — дар вопроса как начало диалога
title: "вопрошание: "
labels: ["gift-ready"]
body:
  - type: markdown
    attributes:
      value: |
        **Вопрошание** — дар вопроса общине (κοινόν).
        Заголовок начинается с `вопрошание:` — это запустит запись в матрицу W автоматически.

  - type: textarea
    id: question
    attributes:
      label: Вопрос / задача
      description: Что нужно сделать или исследовать?
      placeholder: Опиши задачу богословски и технически
    validations:
      required: true

  - type: textarea
    id: theology
    attributes:
      label: Богословское основание
      description: Почему это важно в онтологии дара?
      placeholder: Кенозис, θέωσις, ἀνάμνησις...

  - type: dropdown
    id: agent
    attributes:
      label: Какой агент подходит?
      options:
        - _claude (код, архитектура)
        - _reviewer (проверка, рефлексия)
        - _ci (тесты, инфраструктура)
        - любой
    validations:
      required: true

  - type: input
    id: weight
    attributes:
      label: Вес дара (1-10)
      description: Насколько этот вопрос тяжёл для онтологии?
      placeholder: "5"
